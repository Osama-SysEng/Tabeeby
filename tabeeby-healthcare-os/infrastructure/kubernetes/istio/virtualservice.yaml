apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tabeeby-vs
  namespace: tabeeby-healthcare
spec:
  hosts:
  - api.tabeeby.health
  gateways:
  - tabeeby-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/
    route:
    - destination:
        host: api-gateway
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
