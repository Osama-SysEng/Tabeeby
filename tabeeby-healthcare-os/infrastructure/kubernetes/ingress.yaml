apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tabeeby-ingress
  namespace: tabeeby-healthcare
  annotations:
    kubernetes.io/ingress.class: "istio"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.tabeeby.health
    - app.tabeeby.health
    secretName: tabeeby-tls
  rules:
  - host: api.tabeeby.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000
  - host: app.tabeeby.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web
            port:
              number: 3000
