name: Tabeeby CD

on:
  workflow_run:
    workflows: ["Tabeeby CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      - name: Deploy to AWS EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name tabeeby-aws
          kubectl apply -f infrastructure/kubernetes/
      - name: Deploy to GCP GKE
        run: |
          gcloud container clusters get-credentials tabeeby-gcp --zone us-central1
          kubectl apply -f infrastructure/kubernetes/
      - name: Deploy to Azure AKS
        run: |
          az aks get-credentials --resource-group tabeeby-rg --name tabeeby-azure
          kubectl apply -f infrastructure/kubernetes/
